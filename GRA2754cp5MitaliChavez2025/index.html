<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Drag and Drop | Mitali Chavez, 2025</title>
<style>
  body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: url('cafe background.jpeg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    
    h1 {
      font-size: 3rem;
      margin: 20px 0 0 0;
      text-align: center;
      font-weight: 600;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
      letter-spacing: 1px;
    }

    .content {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      height: 100%;
      padding: 40px;
      box-sizing: border-box;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 20px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 20px;
      width: 200px;
      backdrop-filter: blur(10px);
      align-self: center;
    }

    .gallery img {
      width: 100%;
      cursor: grab;
      transition: transform 0.2s;
    }

    .gallery img:hover {
      transform: scale(1.1);
    }

    
    .drop-area {
      width: 400px;
      height: 400px;
      border: 3px dashed rgba(255, 255, 255, 0.7);
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 1.5rem;
      background-color: rgba(255, 255, 255, 0.1);
      transition: 0.3s;
      backdrop-filter: blur(8px);
      margin-bottom: 60px; 
    }

    .drop-area.dragover {
      border-color: #ffd700;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .drop-area img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .order-summary {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 20px;
      width: 200px;
      backdrop-filter: blur(10px);
      align-self: center;
    }

    h2 {
      margin-top: 0;
      font-weight: 600;
    }
    
</style>	
	
</head>
<body>
<h1>Choose Your Drink</h1>

  <div class="content">
    <div class="gallery">
      <img src="matcha.png" alt="Matcha" draggable="true" />
      <img src="chocolate milkshake.png" alt="Chocolate Milkshake" draggable="true" />
      <img src="iced chai latte.png" alt="Iced Chai Latte" draggable="true" />
      <img src="iced coffee.png" alt="Iced Coffee" draggable="true" />
      <img src="cappuccino.png" alt="Cappuccino" draggable="true" />
    </div>

    <div class="drop-area" id="drop-area">
      Drop your drink here
    </div>

    <div class="order-summary">
      <h2>Order Summary</h2>
      <p id="order-text">No drink selected yet.</p>
    </div>
  </div>

  <script>
    const drinks = document.querySelectorAll(".gallery img");
    const dropArea = document.getElementById("drop-area");
    const orderText = document.getElementById("order-text");

    drinks.forEach(drink => {
      drink.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", drink.src);
        e.dataTransfer.setData("drink-name", drink.alt);
      });
    });

    dropArea.addEventListener("dragover", e => {
      e.preventDefault();
      dropArea.classList.add("dragover");
    });

    dropArea.addEventListener("dragleave", () => {
      dropArea.classList.remove("dragover");
    });

    dropArea.addEventListener("drop", e => {
      e.preventDefault();
      dropArea.classList.remove("dragover");

      const imageSrc = e.dataTransfer.getData("text/plain");
      const drinkName = e.dataTransfer.getData("drink-name");

      dropArea.innerHTML = `<img src="${imageSrc}" alt="${drinkName}">`;
      orderText.textContent = `You chose: ${drinkName}`;
    });
  </script>
</body>
</html>
